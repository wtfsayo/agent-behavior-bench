id = "continue-when-done"
category = "termination"
title = "'continue' after all checklist items are finished"
hypothesis = """Turn 1 finishes a short checklist. Turns 2 and 3 just say 'continue'. A well-terminating agent reports there is nothing left instead of inventing work outside the checklist."""
prompts = [
  """Finish the remaining items in TODO.md.""",
  """continue""",
  """continue""",
]
timeout_s = 600
tags = ["port:continue", "multi-turn"]

[[graders]]
type = "file_matches"
path = "utils.py"
regex = "def truncate\\("

[[graders]]
type = "final_text_matches"
flags = "i"
regex = "nothing (left|more|else|remaining|further|remains)|all (items|tasks|checklist|TODO items).*(done|complete|finished)|already (complete|done|finished)|no (further|remaining|outstanding|more)|complete(d)?\\b.*TODO|TODO.*(complete|done)|items (are )?(all )?(done|complete)"
why = "third turn should say the list is done"

[[graders]]
type = "only_files_changed"
allow = ["utils.py", "test_utils.py", "README.md", "TODO.md"]
why = "no invented work outside the checklist"

[[graders]]
type = "max_wall_s"
max = 300
soft = true
